<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Inšpirácie pre nový web Luigi's Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#111A21;background:#fff}
a{color:#007E90}a:hover{color:#006473}
@keyframes lbxShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes lbxDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-30px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes lbxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.lbx-hero-bg{background:linear-gradient(120deg,#060609 0%,#082938 45%,#0B3A4A 70%,#060609 100%);background-size:200% 200%;animation:lbxShift 18s ease-in-out infinite}
.lbx-blob{animation:lbxDrift 14s ease-in-out infinite}
.lbx-rise{animation:lbxRise 600ms cubic-bezier(0.22,1,0.36,1) both}
.lbx-tile{transition:transform 200ms cubic-bezier(0.4,0,0.2,1),box-shadow 200ms cubic-bezier(0.4,0,0.2,1)}
.lbx-tile:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(11,48,59,0.14)}
.lbx-mood{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;padding:24px 0}
.lbx-btn{grid-column:span 4}
.m-d,.m-e,.m-f,.m-g,.m-k,.m-l,.m-m,.m-n{grid-column:span 3}
@media (max-width:900px){.lbx-mood{grid-template-columns:repeat(2,minmax(0,1fr))}.lbx-btn{grid-column:auto!important}}
@media (max-width:560px){.lbx-mood{grid-template-columns:minmax(0,1fr)}}
.lbx-btn{position:relative;display:block;aspect-ratio:16/9;padding:0;margin:0;border:0;border-radius:14px;background:none;cursor:zoom-in;font:inherit;transition:transform 260ms cubic-bezier(0.22,1,0.36,1),box-shadow 260ms cubic-bezier(0.22,1,0.36,1);box-shadow:0 8px 24px rgba(11,48,59,0.10)}
.lbx-btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(11,48,59,0.20);z-index:2}
.lbx-btn:focus-visible{outline:2px solid #007E90;outline-offset:4px}
.lbx-shot{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:14px;border:1px solid #E5EFF2;box-sizing:border-box;background:#fff}
.lbx-lb-btn{position:absolute;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid rgba(255,255,255,0.24);border-radius:999px;background:rgba(6,6,9,0.6);color:#fff;cursor:pointer;transition:background 160ms cubic-bezier(0.4,0,0.2,1)}
.lbx-lb-btn:hover{background:rgba(255,255,255,0.18)}
.lbx-lb-btn:focus-visible{outline:2px solid #96F1FE;outline-offset:2px}
.lbx-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:560px){.lbx-two{grid-template-columns:minmax(0,1fr)}}
.lbx-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.lbx-three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lbx-three{grid-template-columns:minmax(0,1fr)}}
.lbx-zoom{cursor:zoom-in;font:inherit}
.lbx-zoom:focus-visible{outline:2px solid #007E90;outline-offset:4px}
.lbx-navbtn{background:none;border:0;color:rgba(255,255,255,0.78);font-family:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background 160ms cubic-bezier(0.4,0,0.2,1),color 160ms cubic-bezier(0.4,0,0.2,1)}
.lbx-navbtn:hover{background:rgba(255,255,255,0.1);color:#fff}
.lbx-light .lbx-navbtn{color:#2F414C}
.lbx-light .lbx-navbtn:hover{background:rgba(17,26,33,0.06);color:#111A21}
.lbx-light .lbx-lang:focus-visible,.lbx-light .lbx-navbtn:focus-visible{outline-color:#007E90}
.lbx-navbtn:focus-visible{outline:2px solid #96F1FE;outline-offset:2px}
@media (max-width:760px){.lbx-navlinks{display:none!important}.lbx-topbar{grid-template-columns:1fr auto!important}}
.lbx-lang{cursor:pointer;font-family:inherit;transition:background 160ms cubic-bezier(0.4,0,0.2,1),color 160ms cubic-bezier(0.4,0,0.2,1)}
.lbx-lang:focus-visible{outline:2px solid #96F1FE;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.lbx-hero-bg,.lbx-blob,.lbx-rise{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width:100%;background:#fff">

<!-- NAV -->
<div class="{{ bar.cls }}" style="{{ bar.wrap }}">
  <div style="max-width:1200px;margin:0 auto;box-sizing:border-box">
    <div class="lbx-topbar" style="{{ bar.row }}">
      <div style="justify-self:start">
      <img src="{{ bar.logoSrc }}" alt="Luigi's Box" style="{{ bar.logo }}">
      </div>
      <nav aria-label="{{ t.navLabel }}" class="lbx-navlinks" style="display:flex;align-items:center;gap:4px">
      <sc-for list="{{ navs }}" as="n" hint-placeholder-count="3">
        <button type="button" class="lbx-navbtn" onClick="{{ n.go }}">{{ n.label }}</button>
      </sc-for>
      </nav>
      <div style="justify-self:end">
      <div role="group" aria-label="Language" style="{{ bar.langBox }}">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <button type="button" class="lbx-lang" onClick="{{ l.pick }}" aria-pressed="{{ l.active }}" style="{{ l.style }}">{{ l.code }}</button>
        </sc-for>
      </div>
      </div>
    </div>
  </div>
</div>

<!-- HERO -->
<header class="lbx-hero-bg" style="position:relative;overflow:hidden;color:#fff;padding:96px 24px 0">
  <div class="lbx-blob" style="position:absolute;bottom:-220px;left:-140px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(150,241,254,0.18) 0%,rgba(150,241,254,0) 65%);animation-delay:-6s"></div>
  <div style="position:relative;max-width:1200px;margin:0 auto;box-sizing:border-box">
    <div class="lbx-rise" style="padding:112px 0 128px;max-width:880px;margin:0 auto;text-align:center">
      <div style="display:inline-flex;align-items:center;min-height:36px;padding:0 18px;border:1px solid rgba(150,241,254,0.4);border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#96F1FE;margin-bottom:28px">{{ t.eyebrow }}</div>
      <h1 style="margin:0;font-size:68px;line-height:1.1;font-weight:800;letter-spacing:-0.02em">{{ t.h1a }}<span style="color:#96F1FE">{{ t.h1b }}</span></h1>
      <p style="margin:28px auto 0;font-size:20px;line-height:1.5;color:rgba(255,255,255,0.78);max-width:640px">{{ t.lead }}</p>
    </div>
  </div>
</header>

<!-- SEKCIA 1 -->
<section id="sec-s1" style="padding:112px 24px 96px;background:#fff">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:64px">
    <div style="flex:1 1 440px;min-width:0">
      <div style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#007E90;margin-bottom:16px">{{ t.s1tag }}</div>
      <h2 style="margin:0;font-size:44px;line-height:1.2;font-weight:700;letter-spacing:-0.02em">{{ t.s1title }}</h2>
      <p style="margin:24px 0 0;font-size:17px;line-height:1.65;color:#2F414C">{{ t.s1body }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:32px">
        <a href="https://www.bloomreach.com" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:1.5px solid #2DA1BA;border-radius:999px;font-size:15px;font-weight:600;color:#007E90;text-decoration:none">Bloomreach
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
        <a href="https://stripe.com" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:1.5px solid #2DA1BA;border-radius:999px;font-size:15px;font-weight:600;color:#007E90;text-decoration:none">Stripe
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
        <a href="https://www.shopify.com" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:1.5px solid #2DA1BA;border-radius:999px;font-size:15px;font-weight:600;color:#007E90;text-decoration:none">Shopify
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
      </div>
    </div>
    <div style="flex:1 1 440px;min-width:0;padding-top:34px">
      <p style="margin:0 0 24px;font-size:20px;font-weight:600;line-height:1.4">{{ t.s1intro }}</p>
      <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-bottom:1px solid #E5EFF2">
        <sc-for list="{{ t.bullets }}" as="b" hint-placeholder-count="4">
          <li style="display:flex;gap:16px;align-items:flex-start;padding:24px 0;border-top:1px solid #E5EFF2">
            <span style="flex:none;width:10px;height:10px;margin-top:9px;border-radius:3px;background:#35C2D6"></span>
            <span style="font-size:17px;line-height:1.65;color:#2F414C"><sc-for list="{{ b.parts }}" as="p" hint-placeholder-count="2"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></span>
          </li>
        </sc-for>
      </ul>
    </div>
  </div>
</section>

<!-- GALÉRIA -->
<section style="padding:32px 24px 128px;background:linear-gradient(180deg,#ffffff 0%,#E5F8FA 100%)">
  <div class="lbx-mood">
    <sc-for list="{{ shots }}" as="s" hint-placeholder-count="10">
      <button type="button" class="lbx-btn {{ s.cls }}" onClick="{{ s.open }}" aria-label="{{ s.label }}">
        <img class="lbx-shot" src="{{ s.src }}" alt="{{ s.alt }}">
      </button>
    </sc-for>
  </div>
  <sc-if value="{{ lb.open }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Preview" onClick="{{ lb.close }}" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:rgba(6,6,9,0.9);display:flex;align-items:center;justify-content:center;padding:72px 96px;box-sizing:border-box;cursor:zoom-out">
      <img src="{{ lb.src }}" alt="{{ lb.alt }}" onClick="{{ lb.stop }}" style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:10px;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,0.5)">
      <button type="button" class="lbx-lb-btn" onClick="{{ lb.close }}" aria-label="{{ lb.labelClose }}" style="top:20px;right:20px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <button type="button" class="lbx-lb-btn" onClick="{{ lb.prev }}" aria-label="{{ lb.labelPrev }}" style="left:20px;top:50%;margin-top:-24px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <button type="button" class="lbx-lb-btn" onClick="{{ lb.next }}" aria-label="{{ lb.labelNext }}" style="right:20px;top:50%;margin-top:-24px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </sc-if>
</section>

<!-- SEKCIA 2 -->
<section id="sec-s2" class="lbx-hero-bg" style="position:relative;overflow:hidden;color:#fff;padding:128px 24px 136px">
  <div class="lbx-blob" style="position:absolute;top:-200px;right:-120px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(53,194,214,0.28) 0%,rgba(53,194,214,0) 65%)"></div>
  <div class="lbx-blob" style="position:absolute;bottom:-260px;left:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(150,241,254,0.16) 0%,rgba(150,241,254,0) 65%);animation-delay:-6s"></div>
  <div style="position:relative;max-width:880px;margin:0 auto;text-align:center">
    <div style="display:inline-flex;align-items:center;min-height:36px;padding:0 18px;border:1px solid rgba(150,241,254,0.4);border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#96F1FE;margin-bottom:28px">{{ t.s2tag }}</div>
    <h2 style="margin:0;font-size:60px;line-height:1.12;font-weight:800;letter-spacing:-0.02em">{{ t.s2title }}</h2>
    <p style="margin:28px auto 0;font-size:20px;line-height:1.6;color:rgba(255,255,255,0.78);max-width:720px">{{ t.s2body }}</p>
  </div>
</section>

<sc-for list="{{ t.cases }}" as="c" hint-placeholder-count="2">
<section style="padding:112px 24px 128px;background:linear-gradient(180deg,#ffffff 0%,#E5F8FA 100%)">
  <div style="max-width:1200px;margin:0 auto">
        <div style="{{ c.sep }}">
          <div style="display:flex;flex-wrap:wrap;gap:64px">
            <div style="flex:1 1 440px;min-width:0">
              <div style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#007E90;margin-bottom:16px">{{ c.tag }}</div>
              <h2 style="margin:0;font-size:44px;line-height:1.2;font-weight:700;letter-spacing:-0.02em">{{ c.title }}</h2>
              <p style="margin:24px 0 0;font-size:17px;line-height:1.65;color:#2F414C">{{ c.body }}</p>
              <div style="display:inline-flex;align-items:center;min-height:32px;margin-top:32px;padding:0 14px;border-radius:999px;background:#E5EFF2;color:#4B5E69;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase">{{ t.todayLabel }}</div>
              <button type="button" class="lbx-zoom" onClick="{{ c.openToday }}" aria-label="{{ c.zoomLabel }}" style="display:block;width:100%;margin:16px 0 0;padding:0;border:0;background:none;border-radius:14px">
                <img src="{{ c.img1 }}" alt="{{ c.alt1 }}" style="display:block;width:100%;max-width:100%;height:auto;border-radius:14px;border:1px solid #E5EFF2;box-sizing:border-box;box-shadow:0 8px 24px rgba(11,48,59,0.08)">
              </button>
            </div>
            <div style="flex:1 1 440px;min-width:0;padding-top:34px">
              <p style="margin:0 0 24px;font-size:20px;font-weight:600;line-height:1.4">{{ t.betterLabel }}:</p>
              <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-bottom:1px solid #E5EFF2">
                <sc-for list="{{ c.rows }}" as="r" hint-placeholder-count="3">
                  <li style="display:flex;gap:16px;align-items:flex-start;padding:24px 0;border-top:1px solid #E5EFF2">
                    <span style="flex:none;width:10px;height:10px;margin-top:9px;border-radius:3px;background:#35C2D6"></span>
                    <span style="font-size:17px;line-height:1.65;color:#2F414C"><strong style="color:#111A21;font-weight:600">{{ r.betterT }}.</strong> {{ r.betterB }}</span>
                  </li>
                </sc-for>
              </ul>
            </div>
          </div>
          <div style="margin-top:72px">
            <h3 style="margin:0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-0.01em">{{ t.exTitle }}</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:32px">
              <sc-for list="{{ c.examples }}" as="x" hint-placeholder-count="3">
                <div style="min-width:0">
                <div style="position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#111A21;box-shadow:0 8px 24px rgba(11,48,59,0.10)">
                  <sc-if value="{{ x.isImg }}" hint-placeholder-val="{{ false }}">
                    <img src="{{ x.src }}" alt="{{ x.alt }}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block">
                  </sc-if>
                  <sc-if value="{{ x.isVideo }}" hint-placeholder-val="{{ false }}">
                    <video src="{{ x.src }}" aria-label="{{ x.alt }}" autoplay="" muted="" loop="" playsinline="" preload="metadata" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block"></video>
                  </sc-if>
                  <sc-if value="{{ x.canOpen }}" hint-placeholder-val="{{ false }}">
                    <button type="button" class="lbx-zoom" onClick="{{ x.open }}" aria-label="{{ x.zoomLabel }}" style="position:absolute;top:0;left:0;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;border-radius:14px"></button>
                  </sc-if>
                  <sc-if value="{{ x.isPh }}" hint-placeholder-val="{{ true }}">
                    <div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed #96D9E3;border-radius:14px;background:#F4FBFC;color:#007E90;text-align:center;padding:16px;box-sizing:border-box">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 9"></path></svg>
                      <span style="font-size:14px;font-weight:600">{{ x.label }}</span>
                      <span style="font-size:13px;color:#4B5E69">{{ x.hint }}</span>
                    </div>
                  </sc-if>
                </div>
                <sc-if value="{{ x.hasCaption }}" hint-placeholder-val="{{ false }}">
                  <sc-if value="{{ x.hasText }}" hint-placeholder-val="{{ true }}">
                    <p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#2F414C">{{ x.caption }}</p>
                  </sc-if>
                  <a href="{{ x.url }}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;margin-top:16px;border:1.5px solid #2DA1BA;border-radius:999px;font-size:15px;font-weight:600;color:#007E90;text-decoration:none">{{ x.host }}
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
                </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
  </div>
</section>
</sc-for>

<!-- SEKCIA 3 -->
<section id="sec-s3" class="lbx-hero-bg" style="position:relative;overflow:hidden;color:#fff;padding:128px 24px 136px">
  <div class="lbx-blob" style="position:absolute;top:-200px;left:-120px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(53,194,214,0.28) 0%,rgba(53,194,214,0) 65%)"></div>
  <div class="lbx-blob" style="position:absolute;bottom:-260px;right:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(150,241,254,0.16) 0%,rgba(150,241,254,0) 65%);animation-delay:-6s"></div>
  <div style="position:relative;max-width:880px;margin:0 auto;text-align:center">
    <div style="display:inline-flex;align-items:center;min-height:36px;padding:0 18px;border:1px solid rgba(150,241,254,0.4);border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#96F1FE;margin-bottom:28px">{{ t.s3tag }}</div>
    <h2 style="margin:0;font-size:60px;line-height:1.12;font-weight:800;letter-spacing:-0.02em">{{ t.s3title }}</h2>
    <p style="margin:28px auto 0;font-size:20px;line-height:1.6;color:rgba(255,255,255,0.78);max-width:720px">{{ t.s3body }}</p>
  </div>
</section>

<section style="padding:112px 24px 128px;background:linear-gradient(180deg,#ffffff 0%,#E5F8FA 100%)">
  <div style="max-width:1200px;margin:0 auto">
    <div class="lbx-two">
      <div style="grid-column:1/-1;max-width:820px;margin-bottom:24px">
        <h3 style="margin:0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-0.01em">{{ t.s3g1title }}</h3>
        <p style="margin:12px 0 0;font-size:17px;line-height:1.65;color:#2F414C">{{ t.s3g1body }}</p>
      </div>
      <sc-for list="{{ t.s3items }}" as="x" hint-placeholder-count="6">
        <div style="{{ x.wrap }}">
          <sc-if value="{{ x.isHead }}" hint-placeholder-val="{{ false }}">
            <h3 style="margin:24px 0 0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-0.01em">{{ x.title }}</h3>
            <p style="margin:12px 0 0;font-size:17px;line-height:1.65;color:#2F414C">{{ x.body }}</p>
